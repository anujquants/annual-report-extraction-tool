[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annual-report-extractor"
version = "0.1.0"
description = "Extract and standardize financial statements from annual report PDFs/images for equity research and valuation work."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "XlsxWriter>=3.2",
    "Pillow>=10.0",
]

[project.optional-dependencies]
demo = ["streamlit>=1.30"]

[project.scripts]
arx = "arx.cli:main"
arx-batch = "arx.cli_batch:main"

[tool.setuptools.packages.find]
where = ["src"]
